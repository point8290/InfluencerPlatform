name: credits-wallet

# Two ways to run this:
#
#   docker compose up mysql   Database only. Backend and frontend run on the
#                             host with `npm run dev` — the faster inner loop,
#                             since tsx watch and Vite HMR avoid the bind mount.
#
#   docker compose up         Everything. No host dependency beyond Docker.
#
# Credentials below are local development values with defaults, so a fresh
# clone works with no .env at the repository root. Real Stripe keys are read
# from the environment and are never defaulted to anything usable.

services:
  mysql:
    image: mysql:8.0
    container_name: credits-wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devroot}
    ports:
      # Host 3307, not 3306: a locally installed MySQL usually holds 3306, and
      # publishing there would either fail to bind or silently shadow it.
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # `mysqladmin ping` is not used deliberately: it reports success even when
      # authentication fails, so it can report healthy before the server will
      # actually accept our queries. Running a real query avoids that.
      test:
        [
          'CMD-SHELL',
          'mysql -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: credits-wallet-backend
    restart: unless-stopped
    depends_on:
      mysql:
        # Waits for the healthcheck above, not merely for the container to
        # exist. server.ts calls sequelize.authenticate() before listening, so
        # starting against a still-initializing MySQL would kill the process.
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      # Service name on the compose network, and the container-internal port —
      # not the 3307 the host uses.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: credits_wallet
      DB_NAME_TEST: credits_wallet_test
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-devroot}
      JWT_SECRET: ${JWT_SECRET:-docker-development-secret-not-for-production}
      JWT_EXPIRES_IN: 7d
      # Empty unless exported on the host. env.ts treats empty as missing and
      # only complains at first use, so steps 1-3 run without Stripe keys.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      # Anonymous volume: keeps the container's node_modules from being hidden
      # by the host directory mounted over /app.
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: credits-wallet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Resolved by the browser, not by the container, so this is the host URL.
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # --host 0.0.0.0 is required: Vite binds 127.0.0.1 by default, which inside
    # a container is unreachable from the host.
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
