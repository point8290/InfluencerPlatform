[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-service"
version = "0.1.0"
description = "Event-driven analytics for the influencer platform: Kafka -> Snowflake, served through an RBAC-governed, Redis-cached API."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyJWT>=2.9,<3",
  "redis>=5.0,<6",
  "confluent-kafka>=2.5,<3",
  "snowflake-connector-python>=3.12,<4",
  "cryptography>=42",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.38,<2",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27,<1",
  "fakeredis>=2.24",
  "ruff>=0.6",
]

[project.scripts]
analytics-api = "analytics_service.api.main:run"
analytics-consumer = "analytics_service.consumer.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Query text is assembled only from constant fragments and closed enums;
# every value is bound as a parameter. See the module docstrings.
"src/analytics_service/warehouse/*" = ["S608"]
